# ─────────────────────────────────────────────────────────────
# cloudbuild.yaml — Google Cloud Build configuration
# Build & deploy ke Cloud Run secara otomatis
# ─────────────────────────────────────────────────────────────
#
# Cara pakai:
#   gcloud builds submit --config cloudbuild.yaml .
#
# Atau setup trigger di Cloud Build Console untuk auto-deploy
# setiap push ke branch main.
# ─────────────────────────────────────────────────────────────

steps:
  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/doc-summarizer:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/doc-summarizer:latest'
      - '.'

  # Step 2: Push image ke Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/doc-summarizer:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/doc-summarizer:latest'

  # Step 3: Deploy ke Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'doc-summarizer'
      - '--image'
      - 'gcr.io/$PROJECT_ID/doc-summarizer:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--memory'
      - '4Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '300'
      - '--concurrency'
      - '10'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '3'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'PRELOAD_MODEL=1,MAX_FILE_SIZE_MB=20,CONVEX_URL=${_CONVEX_URL},CONVEX_AUTH_KEY=${_CONVEX_AUTH_KEY}'

# Substitution variables (bisa di-override)
substitutions:
  _REGION: 'asia-southeast2'  # Jakarta
  _CONVEX_URL: 'https://your-project.convex.cloud'  # Ganti dengan URL Convex project
  _CONVEX_AUTH_KEY: ''  # Isi dengan Convex deploy key via --substitutions atau Secret Manager

# Image yang akan disimpan di Container Registry
images:
  - 'gcr.io/$PROJECT_ID/doc-summarizer:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/doc-summarizer:latest'

# Timeout build (model checkpoint cukup besar)
timeout: '1800s'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'  # Build lebih cepat
